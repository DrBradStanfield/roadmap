# fly.toml app configuration file generated for health-tool-app on 2026-01-29T13:46:06+13:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'health-tool-app'
primary_region = 'iad'

[build]
  # Non-secret Sentry slugs for the server source-map upload during the Docker build.
  # (The release name is per-commit so it's passed at deploy time via --build-arg
  # SENTRY_RELEASE=...; the auth token via --build-secret. See CLAUDE.md Deploy Workflow.)
  [build.args]
    SENTRY_ORG = 'dr-brad-inc'
    SENTRY_PROJECT = 'javascript-remix'

[env]
  HOST = '0.0.0.0'
  PORT = '3000'

[processes]
  app = 'npm run start'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

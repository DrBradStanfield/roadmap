<figure class="rmg-fig">
<svg viewBox="0 0 400 254" role="img" aria-labelledby="rmg-cr-t rmg-cr-d" xmlns="http://www.w3.org/2000/svg">
  <title id="rmg-cr-t">Why nothing is ever deleted</title>
  <desc id="rmg-cr-d">A corrected LDL reading for 12 March stays in the file marked entered-in-error. The new reading for the same day is active and points back at the old one through correctsId. Both rows stay in the file.</desc>
  <defs>
    <marker id="rmg-cr-ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a6b5c"/>
    </marker>
  </defs>

  <rect class="rmg-bx" x="96" y="24" width="288" height="68" rx="12"/>
  <text class="rmg-t" x="112" y="54">LDL 3.1 mmol/L</text>
  <text class="rmg-s" x="112" y="78">12 Mar</text>
  <rect x="250" y="62" width="120" height="22" rx="11" fill="#f4f6f8" stroke="#dde4ea" stroke-width="1.5"/>
  <text x="310" y="77" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#8a95a1">entered-in-error</text>

  <rect class="rmg-bx2" x="96" y="140" width="288" height="68" rx="12"/>
  <text class="rmg-t" x="112" y="170">LDL 3.7 mmol/L</text>
  <text class="rmg-s" x="112" y="194">12 Mar</text>
  <rect x="288" y="178" width="82" height="22" rx="11" fill="#e3f3ee" stroke="#a4ccc2" stroke-width="1.5"/>
  <text x="329" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0a6b5c">active</text>

  <path class="rmg-ln" d="M96 174 H62 Q56 174 56 168 V134"/>
  <text class="rmg-m" x="56" y="120" text-anchor="middle">correctsId</text>
  <path class="rmg-ln" d="M56 110 V64 Q56 58 62 58 H90" marker-end="url(#rmg-cr-ae)"/>

  <text class="rmg-m" x="200" y="238" text-anchor="middle">both rows stay in the file</text>
</svg>
<figcaption>The old row is marked as an error, not removed, so you can always see what you were told and when.</figcaption>
</figure>

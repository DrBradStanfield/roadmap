# Stale-PR watchdog (Brad 2026-10-31: "I'm worried that stuff will get
# orphaned and forgotten about").
#
# WHY THIS EXISTS: every change now ships through its own branch and PR
# (CLAUDE.md § Development Rules; docs/git-workflow.md). stranded-branch-watch catches
# a branch that never got a PR; nothing caught a PR that was opened and then
# left. This daily audit lists every open PR with no activity for 48h in ONE
# issue, refreshed each run, so a burst of idle PRs is one email, not dozens.
# The issue is assigned to Brad, which emails him (a bot issue alone emails
# nobody; GHSA-rmrp-qfvm-jf2p). Only the bot's own issue is ever updated, and PR
# titles are escaped so an outsider's title cannot ping or link from it. When
# nothing is stale, the issue is closed with a note.
name: Stale PR watch

# Notifies by GitHub issue: this watch and stranded-branch-watch are the one exception to Brad's Claude-app-only
# notification rule (Brad 2026-11-01, claude_business PR 32), because they are the only
# checks that run when no session is open.
on:
  schedule:
    - cron: '47 12 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # tests/stale-prs.test.ts runs this script with a stub GitHub client (48 h; a draft 7 days).
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const IDLE_MS = 48 * 60 * 60 * 1000;
            const TITLE = '⏳ Stale pull requests (idle over 48h)';
            // A draft (parked while Brad decides) gets a week before it counts as stale.
            const DRAFT_IDLE_MS = 7 * 24 * 60 * 60 * 1000;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const stale = prs
              .filter(p => Date.now() - new Date(p.updated_at).getTime() > (p.draft ? DRAFT_IDLE_MS : IDLE_MS))
              .sort((a, b) => new Date(a.updated_at) - new Date(b.updated_at));
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "Stale pull requests"`,
            });
            // The bot's own issue only: anyone can open one with the same title.
            const open = found.data.items.find(i => i.title === TITLE && i.user?.login === 'github-actions[bot]');
            // A PR title is outsider text: escape table and markdown syntax, defuse @mentions.
            // Bare URLs autolink in GitHub Markdown, so break "://" and "www." too.
            const cell = t => t.replace(/[\\|`*_~[\]<>]/g, c => '\\' + c).replace(/@/g, '@\u200b')
              .replace(/:\/\//g, ':\u200b//').replace(/\bwww\./gi, m => m.slice(0, 3) + '\u200b.');
            if (stale.length === 0) {
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: 'No PR is idle over 48h now. Closing.' });
                await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
              }
              return;
            }
            const days = p => Math.floor((Date.now() - new Date(p.updated_at).getTime()) / 86400000);
            const body = [
              `**${stale.length} open PR(s)** have had no activity for over 48 hours (a draft: over 7 days). Each needs an owner to merge or close it.`,
              '',
              '| PR | Idle | Branch | Author |',
              '|---|---|---|---|',
              ...stale.map(p => `| #${p.number} ${cell(p.title)} | ${days(p)}d | ${cell(p.head.ref)} | ${p.user.login} |`),
              '',
              'What to do with each: merge it (CI green, main merged in, its review gates passed), close it with a note on where its work went, or, if Brad is still deciding, say so in a comment (that resets the clock).',
              '',
              '_Refreshed daily by stale-pr-watch. Closes itself when nothing is stale._',
            ].join('\n');
            if (open) {
              await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
              // An issue opened before assignment existed gets Brad now.
              if (!open.assignees?.some(a => a.login === 'DrBradStanfield')) {
                await github.rest.issues.addAssignees({ owner, repo, issue_number: open.number, assignees: ['DrBradStanfield'] });
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Still ${stale.length} stale PR(s); the list above is refreshed.` });
            } else {
              await github.rest.issues.create({ owner, repo, title: TITLE, body, assignees: ['DrBradStanfield'] });
            }
      # tests/stale-prs.test.ts runs this script too, with a stub GitHub client (12 h).
      - name: Warn when an engine sign approval has waited over 12 h
        # Runs even if the stale-PR step failed, so that failure cannot hide this warning.
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const TITLE = '🔏 Engine release waiting for signing approval';
            const runs = (await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'engine-release.yml', status: 'waiting', per_page: 20,
            })).data.workflow_runs.filter(r => Date.now() - new Date(r.created_at) > 12 * 3600 * 1000);
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "Engine release waiting"`,
            });
            const open = found.data.items.find(i => i.title === TITLE && i.user?.login === 'github-actions[bot]');
            if (!runs.length) {
              if (open) await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
              return;
            }
            const body = 'An engine release has waited over 12 hours for signing approval. Approve or reject it: Actions → the run → Review deployments.\n\n' +
              runs.map(r => `- ${r.html_url} (since ${r.created_at})`).join('\n');
            if (open) await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
            else await github.rest.issues.create({ owner, repo, title: TITLE, body, assignees: ['DrBradStanfield'] });

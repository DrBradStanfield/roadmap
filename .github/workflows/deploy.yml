# Production deploy — the ONLY sanctioned headless path to Shopify + Fly.
#
# Part of the Tier 3 "ship" pipeline (docs/loops/deploy-pipeline-proposal.md):
# author agent opens a PR -> independent reviewer approves -> auto-ship merges
# and dispatches this workflow on main. All deploy credentials live ONLY in the
# 'production' environment — no agent environment ever holds them
# (confused-deputy defense; see the proposal doc).
#
# Brad's build sessions dispatch it the same way instead of deploying from the Mac.
#
# Secrets required:
#   FLY_DEPLOY_TOKEN_PROD   app-scoped deploy token for health-tool-app
#   FLY_DEPLOY_TOKEN_EDU    app-scoped deploy token for health-tool-edu
#   SENTRY_AUTH_TOKEN       sourcemap uploads (widget + server build secret)
#   SHOPIFY_CLI_PARTNERS_TOKEN_PROD / _EDU   Shopify headless deploy auth
#     (App Automation Tokens from the Dev Dashboard — one per app/org; env var
#      name the CLI reads is SHOPIFY_CLI_PARTNERS_TOKEN. If Shopify auth fails
#      on a CLI upgrade, re-check shopify.dev "Deploy in CI/CD" for the current
#      variable name.)
#
# Editing this file is Brad-only (constitution Guardrails — no loop may touch
# .github/workflows/**).

name: Deploy

on:
  workflow_dispatch:
    inputs:
      surfaces:
        description: "What to deploy"
        type: choice
        options: [all, fly-only, shopify-only]
        default: all
      pages_sha:
        # auto-ship passes the commit it merged (US-46 AC15): main may have
        # moved on by the time pages-smoke runs, and then the tip's own Pages
        # run is waited on too. Empty = main's tip only.
        description: "Commit whose Pages run the Pages smoke waits for (empty = main's tip)"
        type: string
        default: ""
# No pull_request trigger (GHSA-v69g-jc5m-3993, 2026-11-02): auto-ship and
# people deploy by dispatching on main. The labelled-merge path it replaced was
# unused. This file alone cannot keep the secrets on main (a branch runs its own
# copy): the 'production' environment's deployment-branch rule, main only, does.

# One deploy at a time; later runs queue rather than interleave.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    # Dispatch only, from main: a human clicked, or auto-ship.yml dispatched
    # after its own reviewer + 30-min veto gate. The environment's main-only
    # branch rule refuses any other ref too; this stops it before the notice.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # veto-window notification issue
    outputs:
      notify_issue: ${{ steps.notify.outputs.issue }}
    steps:
      # Zero-click autonomy relies on a VISIBLE veto window: this issue is
      # Brad's native-email notification that a deploy is pending. The
      # 'production' environment has had no wait timer or reviewer since
      # 2026-09-02 — this gate job is the only check for manual deploys.
      # auto-ship's own 30-min wait step (not this environment) is the Tier 3
      # veto window; the veto here is cancelling the run. verify-live closes
      # the issue on success — an issue left open means a deploy failed or is
      # in flight.
      - name: Veto-window notification (issue → email)
        id: notify
        env:
          GH_TOKEN: ${{ github.token }}
          SURFACES_INPUT: ${{ inputs.surfaces }}
        run: |
          set -euo pipefail
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # The email must be readable WITHOUT clicking: what is shipping, why,
          # and what it touches. A bare SHA tells Brad nothing (2026-08-11).
          subject=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.message' | sed -n '1p')
          body_rest=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.message' | sed -n '2,13p')
          files=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
            --jq '.files[] | "- \(.filename) (+\(.additions)/-\(.deletions))"' | sed -n '1,15p')
          nfiles=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.files | length')
          surfaces="${SURFACES_INPUT:-all}"

          # --assignee + @mention: bot-created issues notify nobody on their
          # own — Brad only gets the email as an assignee/mentioned user.
          n=$(gh issue create -R "${GITHUB_REPOSITORY}" \
            --title "🚀 Deploying: ${subject}" \
            --assignee DrBradStanfield \
            --body "$(printf '%s\n' \
              "@DrBradStanfield, production deploy is starting. There is no wait timer: production changes begin once the Pages smoke, the tests and the builds pass, usually 6 to 10 minutes after this email." \
              "" \
              "## What is shipping" \
              "**${subject}**" \
              "" \
              "${body_rest}" \
              "" \
              "## Files (${nfiles} changed)" \
              "${files}" \
              "" \
              "## Where" \
              "Surfaces: ${surfaces} · commit \`${GITHUB_SHA}\` · triggered by ${GITHUB_ACTOR} (${GITHUB_EVENT_NAME})" \
              "" \
              "## To veto" \
              "Cancel the run within those minutes. Once a Shopify or Fly step has started, cancelling may not undo it: ${url}" \
              "" \
              "---" \
              "This issue auto-closes when live verification passes (a still-open issue = failed or in-flight deploy)." \
              "Fleet dashboard: https://drbradstanfield.github.io/roadmap/fleet.html")" \
            | grep -oE '[0-9]+$')
          echo "issue=${n}" >> "$GITHUB_OUTPUT"

  # Pre-production smoke on GitHub Pages (Brad, 2026-08-10): pages.yml already
  # auto-deploys the Pages build on widget/health-core pushes to main. Before
  # touching production, wait for that deploy (if one was triggered) and smoke
  # the live Pages app in real WebKit. CAVEAT (why production live-verify still
  # exists): Pages has no Shopify theme CSS and no Brad server — theme-CSS bugs
  # and app-proxy paths only reproduce on the real stores.
  pages-smoke:
    needs: gate
    runs-on: ubuntu-latest
    # pages.yml now waits for CI on main before building (US-64 AC9), so the
    # wait below allows 25 min: CI (~3-4) plus the Pages build, with queue room.
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read # the Pages run lookups
      issues: write # the missing-run comment on the gate's issue (US-46 AC16)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false # keeps the token out of .git/config (it is still in the runner's memory)
      - name: Wait for the Pages deploy of this commit (if one was triggered)
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SHA: ${{ inputs.pages_sha }}
          NOTIFY_ISSUE: ${{ needs.gate.outputs.notify_issue }}
        run: |
          set -euo pipefail
          # US-46 AC15: auto-ship names the commit it merged and has just
          # dispatched its Pages run, which takes a few seconds to list, so look
          # for up to 2 minutes. A push's own Pages run lists at once: one look.
          # The deploy job ships main's tip, so when main has moved on past the
          # named commit, the tip's own Pages run is waited on too (one look).
          HEAD_SHA=$(git rev-parse HEAD)
          SHA="${PAGES_SHA:-${HEAD_SHA}}"
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::pages_sha must be a full 40-character commit sha."; exit 1; }
          # find_run SHA LOOKS: run_id = the newest pages.yml run for SHA, or empty.
          find_run() {
            for i in $(seq 1 "$2"); do
              run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?head_sha=$1" \
                --jq '.workflow_runs[0].id // empty')
              [ -n "${run_id}" ] || [ "${i}" -eq "$2" ] || { sleep 10; continue; }
              break
            done
          }
          # newer_run ID: run_id = the newest pages.yml run on main if it is newer than run ID, or empty.
          newer_run() {
            for i in $(seq 1 12); do
              run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&per_page=1" \
                --jq ".workflow_runs[0] | select(.id > $1) | .id")
              [ -n "${run_id}" ] || [ "${i}" -eq 12 ] || { sleep 10; continue; }
              break
            done
          }
          # wait_run ID: up to 25 minutes for the run to finish; fails the step unless it succeeded.
          # US-46 AC16: pages.yml's concurrency cancels a pending run when a newer one queues, and
          # every Pages run builds main's tip, so a cancelled run hands over to a newer run on main.
          wait_run() {
            for i in $(seq 1 150); do
              status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$1" --jq '.status')
              conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$1" --jq '.conclusion // ""')
              if [ "${status}" = "completed" ]; then
                if [ "${conclusion}" = "cancelled" ]; then
                  newer_run "$1"
                  if [ -n "${run_id}" ]; then
                    echo "Pages run $1 was cancelled; newer Pages run ${run_id} on main replaced it: waiting for that one."
                    wait_run "${run_id}"; return 0
                  fi
                fi
                [ "${conclusion}" = "success" ] || { echo "::error::Pages deploy failed (${conclusion})"; exit 1; }
                echo "Pages deploy succeeded."; return 0
              fi
              sleep 10
            done
            echo "::error::Timed out waiting for the Pages deploy."; exit 1
          }
          tries=1; [ -z "${PAGES_SHA:-}" ] || tries=12
          find_run "${SHA}" "${tries}"
          if [ -n "${run_id}" ]; then
            wait_run "${run_id}"
          elif [ -n "${PAGES_SHA:-}" ]; then
            echo "::warning::No pages.yml run for ${SHA} after 12 looks (about 2 minutes) — smoking the existing Pages site."
            # A ::warning:: reaches no one: say it on the deploy's notification issue (US-46 AC16).
            if [ -n "${NOTIFY_ISSUE:-}" ]; then
              gh issue comment "${NOTIFY_ISSUE}" -R "${GITHUB_REPOSITORY}" --body "@DrBradStanfield, the Pages smoke found no pages.yml run for \`${SHA}\` after 12 looks (about 2 minutes); this alone does not stop the deploy. If main has moved on and its tip has a Pages run, the deploy waits for that run and stops unless it (or a newer run that replaces it) succeeds. Otherwise it smokes the Pages site as it stands, which may not hold this commit yet. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                || echo "::warning::Could not comment on the deploy notification issue #${NOTIFY_ISSUE}."
            fi
          else
            echo "No pages.yml run for ${SHA} (server-only change) — smoking the existing Pages site."
          fi
          if [ "${HEAD_SHA}" != "${SHA}" ]; then
            find_run "${HEAD_SHA}" 1
            if [ -n "${run_id}" ]; then
              echo "main has moved on to ${HEAD_SHA}, which the deploy ships: waiting for its Pages run too."
              wait_run "${run_id}"
            else
              echo "main has moved on to ${HEAD_SHA}; no pages.yml run for it (server-only change)."
            fi
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: WebKit smoke — Pages app boots clean
        # NOTE: the script must live INSIDE the workspace — Node resolves
        # 'playwright' relative to the script's path, so /tmp can't see
        # node_modules (first-run failure, 2026-08-10).
        run: |
          cat > ./pages-smoke.tmp.mjs <<'EOF'
          import { webkit, devices } from 'playwright'
          const browser = await webkit.launch()
          const page = await browser.newPage({ ...devices['iPhone 13'] })
          const errors = []
          page.on('pageerror', e => errors.push(String(e)))
          await page.goto('https://drbradstanfield.github.io/roadmap/', { waitUntil: 'networkidle', timeout: 60000 })
          await page.waitForSelector('#health-tool-root', { timeout: 30000 })
          const mounted = await page.evaluate(() =>
            (document.querySelector('#health-tool-root')?.children.length ?? 0) > 0)
          await browser.close()
          if (!mounted) { console.error('Widget did not mount on Pages'); process.exit(1) }
          if (errors.length) { console.error('Page errors:', errors); process.exit(1) }
          console.log('Pages smoke OK — widget mounted, no page errors.')
          EOF
          node ./pages-smoke.tmp.mjs

  deploy:
    needs: [gate, pages-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Deploy credentials live in the 'production' environment. It has had no
    # wait timer or required reviewer since 2026-09-02 — the gate job above is
    # the only check for manual deploys (auto-ship's own 30-min wait step is
    # the Tier 3 veto window, separate from this environment).
    environment: production
    # The token needs only the checkout; the credentials are the secrets below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # always deploy main tip — never a PR snapshot

      - name: Guard — products.md must be a real file (not a symlink)
        run: |
          if [ -L docs/products.md ]; then
            echo "::error::docs/products.md is a symlink in this checkout — the Fly image would ship broken chatbot product knowledge."
            exit 1
          fi
          node scripts/check-symlinks.mjs

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Full test suite (final gate on the exact deployed commit)
        run: npm run test:all

      - name: Typecheck (widget-src + health-core + server)
        run: |
          npx tsc --noEmit -p widget-src/tsconfig.json
          npx tsc --noEmit -p packages/health-core/tsconfig.json
          npm run typecheck:server

      - name: Build widget bundles (main v2 + upload + side bundles)
        run: |
          npm run build:shopify-prod
          npm run build:widget

      - name: Upload widget sourcemaps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Slugs (non-secret) — same values as .env locally; sentry-cli reads
          # them from the environment (run-2 failure: "org ID or slug required").
          SENTRY_ORG: dr-brad-inc
          SENTRY_PROJECT: javascript-remix
        run: cd widget-src && npm run sentry:sourcemaps

      - name: Strip sourcemaps (Shopify 10MB extension limit)
        run: rm -f extensions/health-tool-widget/assets/*.map

      # ---------- Shopify (both apps, same assets) ----------
      - name: Pin Shopify CLI
        if: inputs.surfaces != 'fly-only'
        run: npm i -g @shopify/cli@4.9.4

      - name: Deploy Shopify extensions — prod app (microvitamin)
        if: inputs.surfaces != 'fly-only'
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN_PROD }}
        run: shopify app deploy --allow-updates --config shopify.app.toml

      - name: Deploy Shopify extensions — edu app (drstanfield)
        if: inputs.surfaces != 'fly-only'
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN_EDU }}
        run: shopify app deploy --allow-updates --config shopify.app.edu.toml

      # ---------- Fly (both apps; canary = a boot-crashing image never reaches serving machines) ----------
      # SHA-pinned (audit MED-4): @master on a secret-bearing job is a supply-
      # chain hole. This SHA = tag v1/1.6.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1 / 1.6
        if: inputs.surfaces != 'shopify-only'

      - name: Fly deploy — health-tool-app (commerce)
        if: inputs.surfaces != 'shopify-only'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN_PROD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          flyctl deploy -c fly.toml --strategy canary \
            --build-arg SENTRY_RELEASE="health-tool-app@$(git rev-parse --short HEAD)" \
            --build-secret sentry_auth_token="$SENTRY_AUTH_TOKEN"

      - name: Fly deploy — health-tool-edu (education)
        if: inputs.surfaces != 'shopify-only'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN_EDU }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          flyctl deploy -c fly.edu.toml --strategy canary \
            --build-arg SENTRY_RELEASE="health-tool-edu@$(git rev-parse --short HEAD)" \
            --build-secret sentry_auth_token="$SENTRY_AUTH_TOKEN"

      - name: Health gates
        if: inputs.surfaces != 'shopify-only'
        env:
          FLY_TOKEN_PROD: ${{ secrets.FLY_DEPLOY_TOKEN_PROD }}
          FLY_TOKEN_EDU: ${{ secrets.FLY_DEPLOY_TOKEN_EDU }}
        run: |
          FLY_API_TOKEN="$FLY_TOKEN_PROD" flyctl status -c fly.toml
          FLY_API_TOKEN="$FLY_TOKEN_EDU" flyctl status -c fly.edu.toml

  verify-live:
    needs: [gate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: Live WebKit smoke against production
        run: node tools/webkit-verify.mjs

      - name: Close veto-window issue (deploy verified live)
        if: needs.gate.outputs.notify_issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.gate.outputs.notify_issue }}
        run: |
          gh issue close "$ISSUE" -R "${GITHUB_REPOSITORY}" \
            --comment "$(printf '%s\n' \
              "✅ **Live and verified.** The change above is in production on every surface it targeted." \
              "" \
              "Verified by real-WebKit smoke against the live site (widget mounts, no console errors)." \
              "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"

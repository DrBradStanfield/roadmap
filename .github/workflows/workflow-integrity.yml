# Tripwire + neutralizer for workflow-file tampering.
#
# WHY THIS EXISTS: the Claude GitHub App's grant includes workflows:write (an
# all-or-nothing bundle), push rulesets that would path-restrict
# .github/workflows/** are unavailable on personal public repos, and the
# GITHUB_TOKEN is not allowed to modify workflow files (so a true auto-revert
# from CI is impossible without storing a powerful PAT — which would itself be
# the exfiltration prize). Therefore: true pre-receive REJECTION is not
# available here. This is the strongest enforceable response instead:
#
#   Any push to main touching .github/workflows/** → a 🚨 issue assigned to
#   Brad with an @mention (bot issues alone email nobody), whoever pushed it:
#   agent and loop sessions push as DrBradStanfield too, so the actor proves
#   nothing (GHSA-rmrp-qfvm-jf2p, 2026-11-02). Brad confirms each one.
#   A push by any OTHER actor is also neutralized at once:
#     1. DISABLE every workflow file the push added/modified
#     2. CANCEL any runs those workflows started from the same push
#   Daily scheduled audit: any commit on main's first-parent line in the last
#   26 h that changed workflow files with no successful push check at that sha
#   (a merge made with GITHUB_TOKEN, which starts no workflow; an intermediate
#   commit of a multi-commit push; a check that failed before alerting).
#   Residual, stated (US-46 AC13): a push that edits or deletes THIS file
#   silences both checks, since a push runs the pushed copy and the schedule
#   runs main's. Nothing outside this repo's main watches for that; the
#   product-health loop's weekly git-log review runs with the same identity.
#
# Residual (documented, accepted): a same-push-triggered malicious run may
# execute for a few seconds before cancellation. Only the spend-capped
# ANTHROPIC_API_KEY exists at repo level, but the 'production' environment has
# had no wait timer or required reviewer since 2026-09-02 (deploy.yml), so a
# run that names that environment can read the deploy secrets (Fly, Shopify,
# Sentry) in those seconds. That is why the playbook below revokes them.
#
# Editing this file is Brad-only (constitution Guardrails).

name: Workflow Integrity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The audit reads main's first-parent history; the push check needs no checkout.
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 500
      - name: Alert Brad on every workflow-file change; neutralize non-Brad ones
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Only this workflow's own issue (author github-actions, exact title)
          # takes the alert, never a look-alike anyone can open first.
          TITLE="🚨 SECURITY: workflow files changed on main"
          alert() {
            body="@DrBradStanfield $1"
            existing=$(gh issue list -R "${GITHUB_REPOSITORY}" --state open --author app/github-actions \
              --search "SECURITY workflow files in:title" --json number,title \
              | jq -r --arg t "${TITLE}" '[.[] | select(.title == $t)][0].number // empty')
            if [ -n "${existing}" ]; then
              gh issue comment "${existing}" -R "${GITHUB_REPOSITORY}" --body "${body}"
            else
              gh issue create -R "${GITHUB_REPOSITORY}" --title "${TITLE}" \
                --assignee DrBradStanfield --body "${body}"
            fi
          }

          if [ "${EVENT}" = "push" ]; then
            # What changed: the workflow folder's files and blob shas before and
            # after the push, compared by content. No merge base (a force-push
            # rollback still shows), no file cap. If the old side cannot be read
            # (a new branch, a rewritten history), every file counts as changed.
            listing() { gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows?ref=$1" --jq '[.[] | {path, sha}]'; }
            after=$(listing "${GITHUB_SHA}" || echo '[]')
            before=$(listing "${BEFORE}" 2>/dev/null || echo '[]')
            changes=$(jq -n --argjson a "${after}" --argjson b "${before}" '
              ($b | map({(.path): .sha}) | add // {}) as $old | ($a | map({(.path): .sha}) | add // {}) as $new
              | [($a[] | select($old[.path] != .sha) | {filename: .path, status: "changed"}),
                 ($b[] | select($new[.path] == null) | {filename: .path, status: "removed"})]')
            if [ "${ACTOR}" = "DrBradStanfield" ]; then
              # Agents and loops push as this account too: tell Brad, never disable.
              files=$(echo "${changes}" | jq -r '.[].filename')
              alert "workflow files changed on main, pushed as **${ACTOR}** (commit ${GITHUB_SHA}). Agent and loop sessions push as this account too: if you did not make or merge this, treat it as tampering.
          Files: ${files}
          Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          Playbook if it was not you: (1) disable the changed workflows in the Actions tab; (2) git revert on main;
          (3) revoke the 'production' environment secrets, rotate ANTHROPIC_API_KEY."
              exit 0
            fi
            # 1) Disable every workflow file this push added or modified.
            touched=$(echo "${changes}" | jq -r '.[] | select(.status != "removed") | .filename')
            disabled=""
            for f in ${touched}; do
              wf=$(basename "${f}")
              if gh workflow disable "${wf}" -R "${GITHUB_REPOSITORY}" 2>/dev/null; then
                disabled="${disabled} ${wf}"
              fi
              # 2) Cancel any runs it started from this same push.
              for id in $(gh run list -R "${GITHUB_REPOSITORY}" --workflow="${wf}" --limit 10 \
                            --json databaseId,headSha \
                            --jq ".[] | select(.headSha==\"${GITHUB_SHA}\") | .databaseId" 2>/dev/null); do
                gh run cancel "${id}" -R "${GITHUB_REPOSITORY}" 2>/dev/null || true
              done
            done
            # 3) Alert Brad with the playbook.
            alert "Push by **${ACTOR}** touched workflow files on main (commit ${GITHUB_SHA}).
          Files: ${touched}
          Auto-DISABLED:${disabled:- (none — deletions or disable failed: act NOW)}
          Runs started by this push were cancelled.

          Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          Playbook: (1) review the diff; (2) if malicious: git revert on main,
          revoke the 'production' environment secrets, rotate ANTHROPIC_API_KEY;
          (3) re-enable legitimate workflows via Actions tab."
            exit 0
          fi

          # Scheduled audit: commits on main's FIRST-PARENT line (what was pushed
          # or merged onto main, not a PR's own commits) in the last 26 h that
          # changed workflow files with no SUCCESSFUL push check at that sha.
          # Every author counts: agents push as DrBradStanfield too.
          checked=$(gh run list -R "${GITHUB_REPOSITORY}" --workflow workflow-integrity.yml --event push \
            --limit 100 --json headSha,conclusion --jq '[.[] | select(.conclusion == "success") | .headSha]')
          missed=$(git log --first-parent --since='26 hours ago' --format='%H%x09%an%x09%s' HEAD -- .github/workflows \
            | jq -R -s --argjson checked "${checked}" '[split("\n")[] | select(length > 0) | split("\t")
                | select(.[0] as $s | $checked | index($s) | not)
                | {sha: .[0][0:8], who: .[1], msg: .[2]}]')
          count=$(echo "${missed}" | jq 'length')
          if [ "${count}" -gt 0 ]; then
            alert "daily audit: ${count} workflow-file commit(s) on main in the last 26 h that the push check never ran on:
          \`\`\`json
          ${missed}
          \`\`\`"
          else
            echo "Daily audit clean."
          fi

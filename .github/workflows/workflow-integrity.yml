# Tripwire + neutralizer for workflow-file tampering.
#
# WHY THIS EXISTS: the Claude GitHub App's grant includes workflows:write (an
# all-or-nothing bundle), push rulesets that would path-restrict
# .github/workflows/** are unavailable on personal public repos, and the
# GITHUB_TOKEN is not allowed to modify workflow files (so a true auto-revert
# from CI is impossible without storing a powerful PAT — which would itself be
# the exfiltration prize). Therefore: true pre-receive REJECTION is not
# available here. This is the strongest enforceable response instead:
#
#   Non-Brad push touching .github/workflows/** →
#     1. immediately DISABLE every workflow file the push added/modified
#     2. CANCEL any runs those workflows started from the same push
#     3. open a 🚨 issue (native email to Brad) with the response playbook
#   Daily scheduled audit backstops the tripwire-deleted-in-same-push case;
#   the product-health loop's weekly git-log check is the out-of-band layer.
#
# Residual (documented, accepted): a same-push-triggered malicious run may
# execute for a few seconds before cancellation — which is why the deploy
# credentials live behind the 'production' environment wait timer and only the
# spend-capped ANTHROPIC_API_KEY exists at repo level.
#
# Editing this file is Brad-only (constitution Guardrails).

name: Workflow Integrity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Neutralize and alert on non-Brad workflow-file changes
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          alert() {
            existing=$(gh issue list -R "${GITHUB_REPOSITORY}" --state open \
              --search "SECURITY: workflow files in:title" --json number --jq '.[0].number // empty')
            if [ -n "${existing}" ]; then
              gh issue comment "${existing}" -R "${GITHUB_REPOSITORY}" --body "$1"
            else
              gh issue create -R "${GITHUB_REPOSITORY}" \
                --title "🚨 SECURITY: workflow files changed by a non-Brad actor" \
                --body "$1"
            fi
          }

          if [ "${EVENT}" = "push" ]; then
            if [ "${ACTOR}" = "DrBradStanfield" ]; then
              echo "Workflow change pushed by DrBradStanfield — OK."
              exit 0
            fi
            # 1) Disable every workflow file this push added or modified.
            touched=$(jq -r '[.commits[].added[], .commits[].modified[]] | unique | .[]
                             | select(startswith(".github/workflows/"))' "${GITHUB_EVENT_PATH}")
            disabled=""
            for f in ${touched}; do
              wf=$(basename "${f}")
              if gh workflow disable "${wf}" -R "${GITHUB_REPOSITORY}" 2>/dev/null; then
                disabled="${disabled} ${wf}"
              fi
              # 2) Cancel any runs it started from this same push.
              for id in $(gh run list -R "${GITHUB_REPOSITORY}" --workflow="${wf}" --limit 10 \
                            --json databaseId,headSha \
                            --jq ".[] | select(.headSha==\"${GITHUB_SHA}\") | .databaseId" 2>/dev/null); do
                gh run cancel "${id}" -R "${GITHUB_REPOSITORY}" 2>/dev/null || true
              done
            done
            # 3) Alert Brad with the playbook.
            alert "Push by **${ACTOR}** touched workflow files on main (commit ${GITHUB_SHA}).
          Files: ${touched}
          Auto-DISABLED:${disabled:- (none — deletions or disable failed: act NOW)}
          Runs started by this push were cancelled.

          Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          Playbook: (1) review the diff; (2) if malicious: git revert on main,
          revoke the 'production' environment secrets, rotate ANTHROPIC_API_KEY;
          (3) re-enable legitimate workflows via Actions tab."
            exit 0
          fi

          # Scheduled audit: last 8 days of commits touching workflow files,
          # attributed to any account other than Brad. (Commits from Brad's
          # Mac with an unmapped local email have a null author login — not
          # flagged; the push path above and the product-health loop's weekly
          # log review cover that gap.)
          since=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)
          suspicious=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=.github/workflows&since=${since}&per_page=100" \
            --jq '[.[] | select(.author.login != null and .author.login != "DrBradStanfield")
                   | {sha: .sha[0:8], who: .author.login, msg: (.commit.message | split("\n")[0])}]')
          count=$(echo "${suspicious}" | jq 'length')
          if [ "${count}" -gt 0 ]; then
            alert "Daily audit: ${count} workflow-file commit(s) in the last 8 days not attributed to DrBradStanfield:
          \`\`\`json
          ${suspicious}
          \`\`\`"
          else
            echo "Daily audit clean."
          fi

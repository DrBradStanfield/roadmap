name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Blog index drift check — ensures docs/blog/index.json is derivable from
      # .md frontmatter via scripts/rebuild-blog-index.ts. Catches:
      #   - Accidental deletion of the rebuild script itself (April 2026 incident)
      #   - Orphaned .md files with no index entry (May 2026 aspirin orphan)
      #   - Hand-edits to index.json with fields missing from .md frontmatter
      #     (would be silently dropped on next rebuild)
      # See docs/chat-architecture.md → Source of truth: .md frontmatter
      # Placed BEFORE `npm audit` so dependency vuln noise can't mask drift bugs.
      - name: Verify blog index is in sync with .md frontmatter
        run: |
          if [ ! -f scripts/rebuild-blog-index.ts ]; then
            echo "::error::scripts/rebuild-blog-index.ts is missing. Despite having no imports, this script is load-bearing: it is the bulk-rebuild path for docs/blog/index.json and the only way to detect orphaned .md files. See docs/chat-architecture.md → 'Source of truth: .md frontmatter' → History before recommending deletion."
            exit 1
          fi
          npm run rebuild-index
          if ! git diff --quiet docs/blog/index.json; then
            echo "::error::docs/blog/index.json is out of sync with .md frontmatter. Run 'npm run rebuild-index' locally and commit the regenerated file."
            git diff --stat docs/blog/index.json
            git diff docs/blog/index.json | head -80
            exit 1
          fi
          echo "✓ Blog index is in sync with .md frontmatter"

      # Dependency audit via audit-ci so unfixable advisories can be allowlisted
      # individually (see audit-ci.jsonc for the documented exceptions — currently
      # only the Remix-2.x turbo-stream DoS, removed at the Phase-7 RR7 migration).
      # The gate still fails on any NEW high/critical advisory in production deps.
      - run: npx audit-ci@^7 --config audit-ci.jsonc

      # Secret scan (CLAUDE.md security rules): the deterministic layer no
      # model review can replace. The repo is PUBLIC and .env holds every live
      # credential, so one mis-staged file is an immediate breach. Uses the
      # pinned BINARY, not gitleaks-action (that action requires a paid license
      # for org accounts and adds a supply-chain surface for no gain).
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          VER=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner --exit-code 1
      # test:all runs the root vitest config — a strict superset of `npm test`
      # (health-core + app/lib) that also picks up widget-src and app/routes
      # suites, which were previously never executed in CI.
      - run: npm run test:all
      - run: npm run build
      - run: npm run build:widget

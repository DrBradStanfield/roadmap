name: CI

on:
  pull_request:
    branches: [main]
    # No run on a draft PR (US-46 AC19, Brad 2026-11-12): sessions push to a
    # draft as they go and mark it ready (`gh pr ready`) for CI and review.
    # ready_for_review starts the real run; converted_to_draft joins the PR's
    # lane below, cancelling a run in flight, and its own jobs all skip.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly on main in both zones (US-64 AC22). 03:00 UTC is Los Angeles'
  # evening, when its date differs from the UTC date: the case that zone exists
  # to catch, and hours before its midnight (08:00 UTC).
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

# One run per PR: a newer push to the same PR cancels the older run, which
# nobody reads any more. Pushes to main, manual and nightly runs each get their
# own group (the run id), so they are never cancelled or replaced: pages.yml and
# auto-ship wait for 'test' on those exact commits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Three jobs (US-64 AC12, Brad 2026-11-04): the suite took 7.6 of CI's 9
# minutes on one runner, and every PR waited on it. `checks` runs everything
# but the suite; `unit` splits the suite by file over 6 runners per zone; `test` passes
# only when both did. Its name is the check auto-ship.yml waits for, so keep it.
# The suite runs twice, in UTC and in Los Angeles (US-64 AC22, Brad 2026-11-06):
# a test that assumes UTC passed CI and failed on Brad's Mac in Auckland (PR 911),
# and 153 failed in a US zone. Since 2026-11-12 (Brad) a PR runs UTC only, 6
# runners; pushes to main, manual runs and the nightly run both zones. Los Angeles
# catches US-zone behaviour, but "today" read as the UTC date only when CI runs
# 00:00-08:00 UTC (its evening); Brad's own runs cover a zone ahead of UTC.
# Zones that differ from UTC every hour (UTC-12 and UTC+14) wait on 28
# fixed-clock fixtures (2026-11-06).
# Public repo: the extra 6 runners cost no minutes and run in parallel.
jobs:
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The story-loss gate (US-64 AC11): user-stories.md must still define
      # every story its base did. A truncated read written back whole dropped
      # 17 stories on 2026-09-01. The base is the PR's base, or on main the
      # commit before the push; a ref that cannot be fetched fails the step.
      - name: User stories keep every story their base defines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "${BASE}" in
            *[!0]*) ;; # a real commit
            *) echo "No base commit to compare with (manual run or new branch); skipped."; exit 0;;
          esac
          git fetch --no-tags --depth=1 origin "${BASE}"
          npx tsx scripts/build-user-stories-html.ts --check-against "${BASE}"

      # Blog index drift check — ensures docs/blog/index.json is derivable from
      # .md frontmatter via scripts/rebuild-blog-index.ts. Catches:
      #   - Accidental deletion of the rebuild script itself (April 2026 incident)
      #   - Orphaned .md files with no index entry (May 2026 aspirin orphan)
      #   - Hand-edits to index.json with fields missing from .md frontmatter
      #     (would be silently dropped on next rebuild)
      # Source: scripts/rebuild-blog-index.ts (run it with `npm run rebuild-index`).
      # Placed BEFORE `npm audit` so dependency vuln noise can't mask drift bugs.
      - name: Verify blog index is in sync with .md frontmatter
        run: |
          if [ ! -f scripts/rebuild-blog-index.ts ]; then
            echo "::error::scripts/rebuild-blog-index.ts is missing. Despite having no imports, this script is load-bearing: it is the bulk-rebuild path for docs/blog/index.json and the only way to detect orphaned .md files. Do not delete it; run 'npm run rebuild-index' to rebuild the index."
            exit 1
          fi
          npm run rebuild-index
          if ! git diff --quiet docs/blog/index.json; then
            echo "::error::docs/blog/index.json is out of sync with .md frontmatter. Run 'npm run rebuild-index' locally and commit the regenerated file."
            git diff --stat docs/blog/index.json
            git diff docs/blog/index.json | head -80
            exit 1
          fi
          echo "✓ Blog index is in sync with .md frontmatter"

      # Dependency audit via audit-ci so unfixable advisories can be allowlisted
      # individually (see audit-ci.jsonc for the documented exceptions — currently
      # only the Remix-2.x turbo-stream DoS, removed at the Phase-7 RR7 migration).
      # The gate still fails on any NEW high/critical advisory in production deps.
      - run: npx audit-ci@^7 --config audit-ci.jsonc

      # Secret scan (CLAUDE.md security rules): the deterministic layer no
      # model review can replace. The repo is PUBLIC and .env holds every live
      # credential, so one mis-staged file is an immediate breach. Uses the
      # pinned BINARY, not gitleaks-action (that action requires a paid license
      # for org accounts and adds a supply-chain surface for no gain).
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          VER=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner --config .gitleaks.toml --exit-code 1
      # Typecheck gates (Brad-authorized 2026-08-14). vite/esbuild strips
      # types WITHOUT checking them, which is how standalone/connect.ts shipped
      # with a type-broken, silently no-oping guest-data lift (US-09 AC3
      # incident — docs/loops/sentry-fix/2026-08-14.md). Each project tsconfig
      # was burned down to zero errors when its gate landed, so any error here
      # is NEW. The server uses source declarations, independent of dist/.
      - run: npx tsc --noEmit -p widget-src/tsconfig.json
      - run: npx tsc --noEmit -p packages/health-core/tsconfig.json
      - run: npm run typecheck:server
      # The iPhone engine bundle (ios/engine), which esbuild builds without a
      # type check and which ships over the air. Clean when this gate landed.
      - run: npm run typecheck:engine

      - run: npm run build
      - run: npm run build:widget

  unit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        # PRs run in UTC only; main, manual and nightly runs add Los Angeles (US-64 AC22).
        tz: ${{ fromJSON(github.event_name == 'pull_request' && '["UTC"]' || '["UTC", "America/Los_Angeles"]') }}
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test:all runs the root vitest config — a strict superset of `npm test`
      # (health-core + app/lib) that also picks up widget-src and app/routes
      # suites, which were previously never executed in CI. Each runner takes
      # a sixth of the test files.
      - run: npm run test:all -- --shard=${{ matrix.shard }}/6

  # Skipped on a draft too, so a draft shows no red 'test'. A skipped 'test' is
  # not a pass: auto-ship and pages.yml accept only a successful one.
  test:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [checks, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check and every test shard passed
        env:
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          echo "checks: ${CHECKS}, unit shards: ${UNIT}"
          [ "${CHECKS}" = success ] && [ "${UNIT}" = success ]

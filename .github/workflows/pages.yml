name: Deploy GitHub Pages

# Front door B (implementation plan §5.4 / §10): the standalone static build is
# the primary dev + test surface for v2.
#
#   main → https://drbradstanfield.github.io/roadmap/        (prod / "front door B")
#   dev  → https://drbradstanfield.github.io/roadmap/dev/    (staging preview)
#
# GitHub Pages serves a single artifact per repo, so every run rebuilds BOTH
# branches into one site (main at the root, dev under /dev/). A push to either
# branch refreshes the whole site — the prod root is always the latest `main`,
# never stale. The dev build is best-effort: if `dev` is broken it is simply
# omitted, so it can never block the prod deploy.

on:
  push:
    branches: [main, dev]
    paths:
      - 'widget-src/**'
      - 'packages/health-core/**'
      - '.github/workflows/pages.yml'
      # Fleet dashboard: rebuilt from docs/loops CSVs on every loop commit.
      - 'docs/loops/**'
      - 'scripts/build-fleet-dashboard.mjs'
      - 'docs/user-stories.md'
      - 'scripts/build-user-stories-html.ts'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  checks: read   # the CI wait below
  actions: read  # which workflow a passing 'test' came from

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need both origin/main and origin/dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Publish only a main commit CI passed (US-64 AC9, Brad 2026-11-04). PRs
      # no longer re-test against every newer main before merging, so two PRs'
      # combination may first be tested by CI on main; Pages is a production
      # surface, so it waits for that run (CI starts on the same push) and
      # refuses a red one. Same check auto-ship trusts: 'test' from ci.yml.
      - name: Wait for CI to pass on the main commit being published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse origin/main)
          echo "MAIN_SHA=${SHA}" >> "$GITHUB_ENV"
          for _ in $(seq 120); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=test" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")]' || echo '[]')
            for suite in $(jq -r '.[] | select(.conclusion == "success") | .check_suite.id' <<<"${runs}"); do
              path=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?check_suite_id=${suite}" \
                --jq '.workflow_runs[0].path // empty' || true)
              if [ "${path}" = ".github/workflows/ci.yml" ]; then echo "CI passed on ${SHA}."; exit 0; fi
            done
            if jq -e 'length > 0 and all(.conclusion != null and .conclusion != "success")' <<<"${runs}" >/dev/null; then
              echo "::error::CI failed on ${SHA}; not publishing it."; exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for CI on ${SHA}."; exit 1

      # Prod: main → site root. Always built, regardless of which branch
      # triggered the run, so the root is never left pointing at stale code.
      - name: Build main → /
        run: |
          git checkout --detach "${MAIN_SHA}"
          npm ci
          VITE_BASE=/roadmap/ npm run build:pages
          mkdir -p _site && cp -r widget-src/dist-pages/. _site/

      # Fleet dashboard (must run while main is checked out — the dev step
      # below switches the tree). GITHUB_TOKEN only raises the API rate limit
      # for the "needs attention" fetch; the page is pure static HTML.
      - name: Build fleet dashboard → /fleet.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-fleet-dashboard.mjs _site/fleet.html

      # The user-stories browser copy: built here, never tracked (US-64 AC11),
      # so PRs that add ACs stop conflicting on a 1.7 MB generated file. A bad
      # story line must not hold back the app, so this step only warns.
      - name: Build user stories → /user-stories.html
        continue-on-error: true
        run: npx tsx scripts/build-user-stories-html.ts --link-base https://github.com/DrBradStanfield/roadmap/blob/main/docs/ docs/user-stories.md _site/user-stories.html

      # Staging: dev → /dev/. Best-effort — reuses main's node_modules (dev
      # rarely diverges in deps); a failed dev build warns and is skipped so it
      # cannot block the prod deploy above.
      - name: Build dev → /dev/ (best-effort)
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git checkout --detach origin/dev
            if VITE_BASE=/roadmap/dev/ npm run build:pages; then
              mkdir -p _site/dev && cp -r widget-src/dist-pages/. _site/dev/
              echo "dev subsite built → /roadmap/dev/"
            else
              echo "::warning::dev build failed — publishing prod only"
            fi
          else
            echo "no dev branch yet — publishing prod only"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

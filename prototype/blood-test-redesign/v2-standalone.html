<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V2 Timeline Matrix — Standalone</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
    .stage-row { display: flex; gap: 24px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
    .stage { display: flex; flex-direction: column; gap: 6px; }
    .stage-label { font-size: 11px; font-weight: 600; color: #5b6670; letter-spacing: 0.4px; text-transform: uppercase; }
    /* Frame is just a sizing wrapper — no visual styling so the V2 card is the
       only "outer container" the user sees. */
    .frame { overflow: hidden; }
    /* hide scrollbars inside the frames for visual cleanliness, like the canvas does */
    .frame *::-webkit-scrollbar { display: none; }
    .frame * { scrollbar-width: none; }
  </style>
</head>
<body>
  <div class="stage-row">
    <div class="stage">
      <div class="stage-label">V2 · view state · 460px</div>
      <div class="frame" style="width: 460px; height: 720px;">
        <div id="v2-view" style="width: 100%; height: 100%;"></div>
      </div>
    </div>
    <div class="stage">
      <div class="stage-label">V2 · entering · 460px</div>
      <div class="frame" style="width: 460px; height: 720px;">
        <div id="v2-entry" style="width: 100%; height: 100%;"></div>
      </div>
    </div>
    <div class="stage">
      <div class="stage-label">V2 · view state · 420px (tighter)</div>
      <div class="frame" style="width: 420px; height: 720px;">
        <div id="v2-tight" style="width: 100%; height: 100%;"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="v2-timeline.jsx"></script>

  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('v2-view')).render(<V2_Timeline/>);
    ReactDOM.createRoot(document.getElementById('v2-entry')).render(<V2_TimelineEntering/>);
    ReactDOM.createRoot(document.getElementById('v2-tight')).render(<V2_Timeline/>);
  </script>
</body>
</html>

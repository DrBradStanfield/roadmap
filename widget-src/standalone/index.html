<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='22' fill='%2300a38b'/&gt;&lt;path d='M26 53 l16 16 l32 -36' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/&gt;&lt;/svg&gt;" />
    <title>Get Your Personalized Health Plan · Dr Brad Stanfield</title>
    <style>
      /* Hero header — mirrors the drstanfield.com/pages/roadmap page header. */
      .hr-hero {
        max-width: 1100px; margin: 24px auto 8px; padding: 0 16px;
        display: flex; align-items: center; gap: 28px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .hr-hero-text { flex: 1; }
      .hr-hero-text h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; color: #1c2b33; }
      .hr-hero-text p { font-size: 15px; line-height: 1.55; color: #5a6b73; margin: 0; }
      /* Plain cutout, exactly as on drstanfield.com — no circle crop, no shadow. */
      .hr-hero-img {
        width: 240px; height: auto; flex: 0 0 auto;
      }
      @media (max-width: 700px) {
        .hr-hero { flex-direction: column-reverse; text-align: center; gap: 16px; }
        .hr-hero-img { width: 180px; }
      }

      /* Sync control (rendered inside the plan panel, where "Data synced" was). */
      .hr-sync {
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
        background: #f0faf8; border: 1px solid #b2dfdb; border-radius: 10px;
        padding: 10px 14px; font-size: 13.5px; color: #1c2b33; margin-bottom: 12px;
      }
      .hr-sync-cloud { background: #f0fbf4; border-color: #b7e4c7; }
      .hr-sync-status { font-weight: 600; }
      .hr-sync-detail { color: #5a6b73; font-size: 12.5px; flex-basis: 100%; }
      .hr-sync-btn {
        margin-left: auto; background: #00a38b; color: #fff; border: 0; border-radius: 8px;
        font-size: 13px; font-weight: 600; padding: 7px 13px; cursor: pointer;
      }
      .hr-sync-btn:hover { background: #008f7a; }
      .hr-sync-link {
        margin-left: auto; background: none; border: 0; color: #5a6b73;
        font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 4px;
      }
      .hr-sync-btn:disabled { opacity: 0.5; cursor: default; }
      .hr-sync-more { flex-basis: 100%; margin-top: 2px; }
      .hr-sync-more .hr-sync-link { margin-left: 0; }
      .hr-sync-form { display: flex; flex-direction: column; gap: 7px; }
      .hr-sync-form input {
        padding: 8px 10px; border: 1px solid #cdd9dd; border-radius: 7px; font-size: 13px;
      }
      .hr-sync-form .hr-sync-btn { margin-left: 0; align-self: flex-start; }
      .hr-sync-error { flex-basis: 100%; color: #b91c1c; font-size: 12.5px; margin-top: 6px; }
      /* Email-reminders toggle row, under the sync status line. */
      .hr-reminders {
        flex-basis: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        margin-top: 6px; padding-top: 6px; border-top: 1px dashed #cfe3d6;
      }
      .hr-reminders .hr-sync-link { margin-left: 0; }
      .hr-reminders .hr-sync-status { font-size: 12.5px; }
      .hr-reminders .hr-sync-detail { flex-basis: auto; }

      /* "Where should your health plan live?" lightbox. */
      .hr-modal-overlay {
        position: fixed; inset: 0; background: rgba(28, 43, 51, 0.45); z-index: 1000;
        display: flex; align-items: center; justify-content: center; padding: 16px;
      }
      .hr-modal {
        position: relative; background: #fff; border-radius: 14px; max-width: 520px; width: 100%;
        max-height: 90vh; overflow-y: auto; padding: 24px 24px 20px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.22);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1c2b33;
      }
      .hr-modal h2 { font-size: 19px; margin: 0 32px 6px 0; }
      .hr-modal-sub { font-size: 13.5px; color: #5a6b73; margin: 0 0 14px; }
      .hr-modal-close {
        position: absolute; top: 10px; right: 12px; background: none; border: 0;
        font-size: 24px; line-height: 1; color: #5a6b73; cursor: pointer; padding: 4px;
      }
      .hr-modal-back {
        background: none; border: 0; color: #00897b; font-size: 13px; cursor: pointer;
        padding: 0; margin-bottom: 10px;
      }
      .hr-opt {
        display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
        background: #fff; border: 1px solid #cdd9dd; border-radius: 10px;
        padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
      }
      .hr-opt:hover { border-color: #00a38b; background: #f7fcfb; }
      .hr-opt:disabled { opacity: 0.55; cursor: default; }
      .hr-opt-logo { flex: 0 0 auto; width: 24px; height: 24px; }
      .hr-opt-logo svg { width: 24px; height: 24px; display: block; }
      .hr-opt-text { display: flex; flex-direction: column; gap: 2px; }
      .hr-opt-name { font-size: 14.5px; font-weight: 600; }
      .hr-opt-blurb { font-size: 12.5px; color: #5a6b73; }
      .hr-opt-connected {
        margin-left: 8px; font-size: 11px; font-weight: 700; color: #0a7a5f;
        background: #e6f6f1; border-radius: 10px; padding: 2px 8px; vertical-align: 1px;
      }
      .hr-opt-divider {
        font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
        color: #8aa0a9; margin: 12px 0 8px;
      }
      .hr-opt-local { border-style: dashed; }
      @media (max-width: 600px) {
        .hr-modal-overlay { padding: 0; align-items: stretch; }
        .hr-modal { max-width: none; border-radius: 0; max-height: none; }
      }
    </style>
  </head>
  <body>
    <header class="hr-hero">
      <div class="hr-hero-text">
        <h1>Get Your Personalized Health Plan</h1>
        <p>Enter your health information below to receive personalized suggestions to discuss with your healthcare provider. The more information you provide, the more tailored your suggestions will be.</p>
      </div>
      <img
        class="hr-hero-img"
        src="https://cdn.shopify.com/s/files/1/0736/2907/3693/files/SMILING_2.webp?v=1754525200&width=800"
        alt="Dr Brad Stanfield"
        loading="eager"
      />
    </header>
    <!-- data-logged-in=true: standalone has no Shopify login; the local-first store
         IS the data layer, so we take the has-data path. The real sync status is
         injected into the plan panel via the syncControl prop (see app.tsx). -->
    <div id="health-tool-root" data-logged-in="true"></div>
    <script type="module" src="./app.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='22' fill='%2300a38b'/&gt;&lt;path d='M26 53 l16 16 l32 -36' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/&gt;&lt;/svg&gt;" />
    <title>Get Your Personalized Health Plan · Dr Brad Stanfield</title>
    <!-- Critical hero layout CSS, inlined so the header is laid out correctly on
         the FIRST paint. The full stylesheet (standalone.css) is injected by JS
         after first paint in the Vite dev server, so without this the hero image
         flashed in raw document flow (wrong position/size) before snapping into
         the flex row. Keep these rules in sync with .hr-hero* in standalone.css. -->
    <style>
      .hr-hero {
        max-width: 1100px; margin: 24px auto 8px; padding: 0 16px;
        display: flex; align-items: center; gap: 28px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .hr-hero-text { flex: 1; }
      .hr-hero-img { width: 240px; height: auto; flex: 0 0 auto; }
      @media (max-width: 700px) {
        .hr-hero { flex-direction: column-reverse; text-align: center; gap: 16px; }
        .hr-hero-img { width: 180px; }
      }
    </style>
  </head>
  <body>
    <header class="hr-hero">
      <div class="hr-hero-text">
        <h1>Get Your Personalized Health Plan</h1>
        <p>Enter your health information below to receive personalized suggestions to discuss with your healthcare provider. The more information you provide, the more tailored your suggestions will be.</p>
      </div>
      <img
        class="hr-hero-img"
        src="https://cdn.shopify.com/s/files/1/0736/2907/3693/files/SMILING_2.webp?v=1754525200&width=480"
        alt="Dr Brad Stanfield"
        loading="eager"
        width="240"
        height="218"
      />
    </header>
    <!-- data-logged-in=true: standalone has no Shopify login; the local-first store
         IS the data layer, so we take the has-data path. The real sync status is
         injected into the plan panel via the syncControl prop (see app.tsx). -->
    <!-- data-upload-url: the lazy extraction bundle (pdf.js + JSZip), built
         into dist-pages alongside the app — relative so /roadmap/ and /roadmap/dev/
         both resolve their own copy. -->
    <!-- Loading skeleton: paints before app.tsx loads so the widget box is
         reserved at ~its real above-the-fold size (near-zero layout shift).
         React replaces these children on mount. Shimmer styles ship in the
         bundled styles.css (.hr-skeleton*). -->
    <div id="health-tool-root" data-logged-in="true" data-upload-url="./health-upload.js">
      <div class="hr-skeleton" aria-hidden="true">
        <div class="hr-skel-tabbar">&nbsp;</div>
        <div class="hr-skeleton-content">
          <div class="hr-skeleton-col">
            <div class="hr-skel-colhead">&nbsp;</div>
            <div class="hr-skel-card">
              <div class="hr-skel-line hr-skel-line--title">&nbsp;</div>
              <div class="hr-skel-line hr-skel-line--input">&nbsp;</div>
              <div class="hr-skel-line hr-skel-line--input">&nbsp;</div>
              <div class="hr-skel-line hr-skel-line--input">&nbsp;</div>
              <div class="hr-skel-line hr-skel-line--input">&nbsp;</div>
              <div class="hr-skel-line hr-skel-line--input">&nbsp;</div>
              <div class="hr-skel-line hr-skel-line--med">&nbsp;</div>
            </div>
          </div>
          <div class="hr-skeleton-col">
            <div class="hr-skel-colhead">&nbsp;</div>
            <div class="hr-skel-card">
              <div class="hr-skel-line hr-skel-line--title">&nbsp;</div>
              <div class="hr-skel-line">&nbsp;</div>
              <div class="hr-skel-line hr-skel-line--med">&nbsp;</div>
              <div class="hr-skel-line hr-skel-line--short">&nbsp;</div>
            </div>
          </div>
          <div class="hr-skeleton-col">
            <div class="hr-skel-colhead">&nbsp;</div>
            <div class="hr-skel-card">
              <div class="hr-skel-line hr-skel-line--title">&nbsp;</div>
              <div class="hr-skel-line">&nbsp;</div>
              <div class="hr-skel-line hr-skel-line--med">&nbsp;</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./app.tsx"></script>
  </body>
</html>

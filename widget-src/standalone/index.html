<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='22' fill='%2300a38b'/&gt;&lt;path d='M26 53 l16 16 l32 -36' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/&gt;&lt;/svg&gt;" />
    <title>Get Your Personalized Health Plan · Dr Brad Stanfield</title>
  </head>
  <body>
    <header class="hr-hero">
      <div class="hr-hero-text">
        <h1>Get Your Personalized Health Plan</h1>
        <p>Enter your health information below to receive personalized suggestions to discuss with your healthcare provider. The more information you provide, the more tailored your suggestions will be.</p>
      </div>
      <img
        class="hr-hero-img"
        src="https://cdn.shopify.com/s/files/1/0736/2907/3693/files/SMILING_2.webp?v=1754525200&width=800"
        alt="Dr Brad Stanfield"
        loading="eager"
      />
    </header>
    <!-- data-logged-in=true: standalone has no Shopify login; the local-first store
         IS the data layer, so we take the has-data path. The real sync status is
         injected into the plan panel via the syncControl prop (see app.tsx). -->
    <!-- data-upload-url: the lazy extraction bundle (pdf.js + JSZip), built
         into dist-pages alongside the app — relative so /roadmap/ and /roadmap/dev/
         both resolve their own copy. -->
    <div id="health-tool-root" data-logged-in="true" data-upload-url="./health-upload.js"></div>
    <script type="module" src="./app.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='22' fill='%2300a38b'/&gt;&lt;path d='M26 53 l16 16 l32 -36' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/&gt;&lt;/svg&gt;" />
    <title>Health Roadmap</title>
    <style>
      /* Standalone-only styling. The Shopify account-status block ("Logged in ·
         Data synced" + a redundant manual Save button) is meaningless here — no
         Shopify login, and saving is automatic (debounce + unload flush). Hide
         the whole block and show the real sync status via the connect-a-cloud
         control. Scoped to .hr-standalone so it never affects the live widget. */
      .hr-standalone .account-status { display: none; }
      #hr-sync-control {
        max-width: 1100px;
        margin: 12px auto 0;
        padding: 0 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .hr-sync {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
        background: #f0faf8; border: 1px solid #b2dfdb; border-radius: 10px;
        padding: 10px 16px; font-size: 14px; color: #1c2b33;
      }
      .hr-sync-dropbox { background: #f0fbf4; border-color: #b7e4c7; }
      .hr-sync-status { font-weight: 600; }
      .hr-sync-detail { color: #5a6b73; font-size: 13px; }
      .hr-sync code { background: #eef2f3; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
      .hr-sync-btn {
        margin-left: auto; background: #00a38b; color: #fff; border: 0; border-radius: 8px;
        font-size: 13px; font-weight: 600; padding: 8px 14px; cursor: pointer;
      }
      .hr-sync-btn:hover { background: #008f7a; }
      .hr-sync-link {
        margin-left: auto; background: none; border: 0; color: #5a6b73;
        font-size: 13px; text-decoration: underline; cursor: pointer; padding: 4px;
      }
    </style>
  </head>
  <body class="hr-standalone">
    <!-- Real sync status + connect-a-cloud control (replaces the Shopify auth line). -->
    <div id="hr-sync-control"></div>
    <!-- data-logged-in=true: standalone has no Shopify login; the local-first store
         IS the data layer, so we take the has-data path. -->
    <div id="health-tool-root" data-logged-in="true"></div>
    <script type="module" src="./app.tsx"></script>
  </body>
</html>
